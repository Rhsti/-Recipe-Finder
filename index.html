<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Finder</title>
    <script
      src="https://kit.fontawesome.com/d0ebfd2456.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <div>
        <img src="./img/recipefinderlogo.png" alt="" />
        <div>
          <h1>Recipe Finder</h1>
          <p>Find. Cook. Enjoy</p>
        </div>
      </div>
      <nav>
        <ul class="ul-hidden-menu">
          <li><a href="./">Home</a></li>
          <li><a href="/favorites.html">Favorites</a></li>
        </ul>
        <i class="fa-solid fa-bars"></i>
        <i class="fa-solid fa-x"></i>
      </nav>
    </header>
    <!-- hero section -->
    <section>
      <div>
        <h2>Discover <span> delicious</span> recipes Made for You.</h2>
        <p>
          Explore amazing recipes, discover new flavors, and find the perfect
          dish for every moment. Your next favorite meal starts here!
        </p>
        <button class="ExploreRecipes">Explore Recipes →</button>
      </div>
      <img id="hero-img" src="/img/heroimg.png" alt="img" />

      <!-- <p>Search for your favorite recipe or </p> -->
    </section>
    <!-- main -->
    <main>
      <div class="searchandselect">
        
          <input
            type="text"
            id="search-input"
            placeholder="Search recipes..."
          />
         

        <select id="difficulty-select">
          <option value="All">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
      </div>
      <!-- cantainer -->
      <div class="container"></div>
      <div id="recipe-details"></div>
    </main>
    <!-- footer -->
    <footer>
      <div>
        <img src="./img/recipefinderlogo.png" alt="" />
        <div>
          <h1>Recipe Finder</h1>
        </div>
      </div>

      <ul>
        <li><a href="./">Home</a></li>
        <hr />
        <li><a href="/favorites.html">Favorites</a></li>
      </ul>

      <div class="icons">
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-youtube"></i>
        <i class="fa-brands fa-tiktok"></i>
      </div>
    </footer>

    <script src="./js/app.js"></script>
  </body>
</html>
